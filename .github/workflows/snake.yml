name: Generate Snake

on:
  # Corre todos los días a medianoche UTC
  schedule:
    - cron: "0 0 * * *"
  # Permite ejecutarlo a mano desde la pestaña Actions
  workflow_dispatch:
  # También al hacer push a main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generar SVG de la snake
        uses: Platane/snk@v3
        with:
          github_user_name: raukdv
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
